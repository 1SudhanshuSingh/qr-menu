[build]
  command = "npx prisma generate && npx next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Prisma needs this for Netlify Lambda (Linux ARM64)
  PRISMA_CLI_BINARY_TARGETS = "rhel-openssl-3.0.x,linux-arm64-openssl-3.0.x"

[[plugins]]
  package = "@netlify/plugin-nextjs"
